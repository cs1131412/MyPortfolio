# Netlify build settings (read automatically when the repo is connected).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# Client-side routing: serve index.html for every path so refreshing on
# /about etc. doesn't 404. (Same rule as public/_redirects.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
